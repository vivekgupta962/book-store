<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - Online Book Store</title>
    <link rel="stylesheet" href="styles.css">
</head>

<!-- LOGIN PAGE (Experiment 2) - loads in the right frame. -->
<body class="frame-body right-frame">

    <section class="panel form-panel">
        <h2>Login Page</h2>

        <div id="form-message"></div>

        <form id="login-form">
            <table class="form-table">
                <tr>
                    <td><label for="username">User Name :</label></td>
                    <td><input type="text" id="username" name="username" size="24"></td>
                </tr>
                <tr>
                    <td><label for="password">Password :</label></td>
                    <td><input type="password" id="password" name="password" size="24"></td>
                </tr>
                <tr>
                    <td></td>
                    <td class="button-row">
                        <button type="submit">Submit</button>
                        <button type="reset">Reset</button>
                    </td>
                </tr>
            </table>
        </form>

        <p class="form-note">
            New here? <a href="registration.html">Create an account on the Registration page</a>.
        </p>
    </section>

    <script src="script.js"></script>
</body>
</html>
