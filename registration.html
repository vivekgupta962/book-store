<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Registration - Online Book Store</title>
    <link rel="stylesheet" href="styles.css">
</head>

<!-- REGISTRATION PAGE (Experiment 5) with the fields listed in the syllabus.
     The JavaScript validation for Name, Password, E-mail id and Phone Number
     (Experiments 6 and 7) lives in script.js. -->
<body class="frame-body right-frame">

    <section class="panel form-panel wide">
        <h2>Registration Form</h2>

        <div id="form-message"></div>

        <form id="registration-form" novalidate>
            <table class="form-table">
                <tr>
                    <td><label for="name">Name :</label></td>
                    <td><input type="text" id="name" name="name" size="28"></td>
                </tr>

                <tr>
                    <td><label for="password">Password :</label></td>
                    <td><input type="password" id="password" name="password" size="28"></td>
                </tr>

                <tr>
                    <td><label for="email">E-mail id :</label></td>
                    <td><input type="text" id="email" name="email" size="28"></td>
                </tr>

                <tr>
                    <td><label for="phone">Phone Number :</label></td>
                    <td><input type="text" id="phone" name="phone" size="28" maxlength="10"></td>
                </tr>

                <tr>
                    <td>Sex :</td>
                    <td class="inline-options">
                        <label><input type="radio" name="sex" value="Male"> Male</label>
                        <label><input type="radio" name="sex" value="Female"> Female</label>
                    </td>
                </tr>

                <tr>
                    <td>Date of Birth :</td>
                    <td class="dob-row">
                        <select id="dob-day" name="dob-day">
                            <option value="">Day</option>
                        </select>
                        <select id="dob-month" name="dob-month">
                            <option value="">Month</option>
                            <option value="1">January</option>
                            <option value="2">February</option>
                            <option value="3">March</option>
                            <option value="4">April</option>
                            <option value="5">May</option>
                            <option value="6">June</option>
                            <option value="7">July</option>
                            <option value="8">August</option>
                            <option value="9">September</option>
                            <option value="10">October</option>
                            <option value="11">November</option>
                            <option value="12">December</option>
                        </select>
                        <select id="dob-year" name="dob-year">
                            <option value="">Year</option>
                        </select>
                    </td>
                </tr>

                <tr>
                    <td>Languages known :</td>
                    <td class="inline-options checkbox-grid">
                        <label><input type="checkbox" name="languages" value="English"> English</label>
                        <label><input type="checkbox" name="languages" value="Telugu"> Telugu</label>
                        <label><input type="checkbox" name="languages" value="Hindi"> Hindi</label>
                        <label><input type="checkbox" name="languages" value="Tamil"> Tamil</label>
                    </td>
                </tr>

                <tr>
                    <td><label for="address">Address :</label></td>
                    <td><textarea id="address" name="address" rows="4" cols="30"></textarea></td>
                </tr>

                <tr>
                    <td></td>
                    <td class="button-row">
                        <button type="submit">Submit</button>
                        <button type="reset">Reset</button>
                    </td>
                </tr>
            </table>
        </form>
    </section>

    <script src="script.js"></script>
</body>
</html>
